<style>

#snd{position:fixed;top:calc(40px + env(safe-area-inset-top,0px));right:calc(62px + env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:10px;background:rgba(36,66,95,.7);display:flex;align-items:center;justify-content:center;font-size:22px;z-index:5;opacity:.75}

#go{padding:9px 14px;border-radius:8px;background:#e8a33a;color:#111;font-weight:700;font-size:16px}

<canvas id="g" width="800" height="450"></canvas>
<div class="pad" id="l" oncontextmenu="return false">
<button data-k="ArrowUp" style="grid-area:u">▲</button><button data-k="ArrowLeft" style="grid-area:a">◄</button><button data-k="ArrowDown" style="grid-area:d">▼</button><button data-k="ArrowRight" style="grid-area:b">►</button></div>

<script>
const AU={ctx:null,on:true,last:{},
init(){if(this.ctx){if(this.ctx.state=='suspended')this.ctx.resume();return}
 try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=this.ctx=new C();
 this.m=c.createGain();this.m.gain.value=this.on?.55:0;
 const comp=c.createDynamicsCompressor();this.m.connect(comp);comp.connect(c.destination);
 const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.nb=nb;
 this.e1=this.mkEng(c,55);this.e2=this.mkEng(c,90)}catch(e){this.ctx=null}},
mkEng(c,base){const o1=c.createOscillator(),o2=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain(),tr=c.createGain(),l=c.createOscillator(),lg=c.createGain(),pn=c.createStereoPanner?c.createStereoPanner():null;
 o1.type='sawtooth';o2.type='square';f.type='lowpass';f.frequency.value=base*9;g.gain.value=0;tr.gain.value=.7;l.frequency.value=20;lg.gain.value=.3;
 l.connect(lg);lg.connect(tr.gain);o1.connect(f);o2.connect(f);f.connect(tr);tr.connect(g);
 if(pn){g.connect(pn);pn.connect(this.m)}else g.connect(this.m);
 o1.start();o2.start();l.start();return{o1,o2,g,f,pn,l}},
setEng(e,fr,vol,pan){if(!e)return;const t=this.ctx.currentTime;e.o1.frequency.setTargetAtTime(fr,t,.08);e.o2.frequency.setTargetAtTime(fr*1.02,t,.08);e.l.frequency.setTargetAtTime(fr*.4,t,.1);e.g.gain.setTargetAtTime(vol,t,.1);if(e.pn)e.pn.pan.setTargetAtTime(Math.max(-1,Math.min(1,pan||0)),t,.1)},
out(n,pan){const c=this.ctx;if(pan&&c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=Math.max(-1,Math.min(1,pan));n.connect(p);p.connect(this.m)}else n.connect(this.m)},
d(x){const dd=wrapD(x-p.x);return{v:Math.pow(Math.max(0,1-Math.abs(dd)/650),1.3),pan:dd/500}},
noise(dur,type,f0,f1,vol,pan,delay,Q){if(!this.ctx||!this.on)return;const c=this.ctx,t=c.currentTime+(delay||0),s=c.createBufferSource();s.buffer=this.nb;s.loop=true;
 const f=c.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);if(Q)f.Q.value=Q;
 const g=c.createGain();g.gain.setValueAtTime(Math.max(.0001,vol),t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 s.connect(f);f.connect(g);this.out(g,pan);s.start(t,Math.random()*.5);s.stop(t+dur+.03)},
tone(type,f0,f1,dur,vol,pan,delay){if(!this.ctx||!this.on)return;const c=this.ctx,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
 o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
 g.gain.setValueAtTime(Math.max(.0001,vol),t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);this.out(g,pan);o.start(t);o.stop(t+dur+.03)},
gun(){this.noise(.07,'bandpass',2200,900,.28,0,0,1.2);this.tone('square',170,70,.07,.12)},
bomb(){this.tone('sine',1400,350,.9,.1)},
boom(x,r,w){if(!this.ctx)return;const k=this.d(x);if(k.v<.04)return;const n=performance.now();if(n-(this.last.b||0)<35)return;this.last.b=n;
 if(w){this.noise(.4,'bandpass',1800,400,.3*k.v,k.pan,0,.7);return}
 if(r<=10){this.noise(.05,'bandpass',2500,1200,.14*k.v,k.pan,0,1);return}
 const big=Math.min(1,r/45);this.noise(.5+big*.5,'lowpass',1500,60,.7*k.v,k.pan);this.tone('sine',110,28,.6+big*.4,.6*k.v,k.pan)},
scream(x){const c=this.ctx;if(!c||!this.on)return;const k=this.d(x);if(k.v<.05)return;
 const t=c.currentTime+Math.random()*.12,f=330+Math.random()*220,o=c.createOscillator(),v=c.createOscillator(),vg=c.createGain(),bp=c.createBiquadFilter(),g=c.createGain();
 o.type='sawtooth';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.5,t+.7);v.frequency.value=9;vg.gain.value=14;v.connect(vg);vg.connect(o.frequency);
 bp.type='bandpass';bp.frequency.setValueAtTime(900,t);bp.frequency.linearRampToValueAtTime(600,t+.7);bp.Q.value=3;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35*k.v,t+.04);g.gain.exponentialRampToValueAtTime(.001,t+.75);
 o.connect(bp);bp.connect(g);this.out(g,k.pan);o.start(t);v.start(t);o.stop(t+.8);v.stop(t+.8);
 this.noise(.45,'bandpass',1500,900,.06*k.v,k.pan,t-c.currentTime,2)},
rifle(x){const k=this.d(x);if(k.v<.04)return;this.noise(.05,'highpass',2800,2800,.2*k.v,k.pan);this.tone('sawtooth',900,200,.06,.06*k.v,k.pan)},
flak(x){const k=this.d(x);if(k.v<.04)return;this.noise(.25,'lowpass',900,150,.5*k.v,k.pan);this.tone('sine',160,50,.25,.35*k.v,k.pan)},
pshot(x){const k=this.d(x);if(k.v<.04)return;this.noise(.08,'bandpass',2000,1000,.2*k.v,k.pan,0,1);this.tone('square',240,100,.08,.08*k.v,k.pan)},
hit(){this.noise(.15,'bandpass',3500,900,.4,0,0,3);this.tone('square',700,200,.2,.18)},
land(){this.noise(.25,'lowpass',500,80,.45);this.tone('sine',500,800,.15,.12,0,.15)},
jingle(win){const n=win?[523,659,784,1047]:[392,330,262,196];n.forEach((f,i)=>this.tone(win?'triangle':'sawtooth',f,f,.35,win?.25:.15,0,i*.16))},
upd(){if(!this.ctx)return;let v=0,fr=50;
 if(S=='play'&&p.st!='dead'){v=p.st=='deck'?(p.sp>0?.12:.06):.13;fr=p.st=='deck'?40+p.sp*10:48+p.sp*11}
 this.setEng(this.e1,fr,v,0);
 let ev=0,pan=0;if(S=='play'){for(const e of ep){if(e.hp<=0)continue;const dd=wrapD(e.x-p.x),dist=Math.hypot(dd,e.y-p.y),vv=Math.max(0,1-dist/600);if(vv>ev){ev=vv;pan=dd/500}}}
 this.setEng(this.e2,75,ev*.1,pan)}};
['pointerdown','keydown','touchend'].forEach(n=>addEventListener(n,()=>AU.init(),true));
document.addEventListener('visibilitychange',()=>{if(AU.ctx)document.hidden?AU.ctx.suspend():AU.ctx.resume()});
const sndb=document.getElementById('snd');
sndb.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();AU.init();AU.on=!AU.on;sndb.textContent=AU.on?'🔊':'🔇';if(AU.ctx)AU.m.gain.setTargetAtTime(AU.on?.55:0,AU.ctx.currentTime,.05)});
const menu=document.getElementById('menu'),codeIn=document.getElementById('code'),cm=document.getElementById('cm'),fsb=document.getElementById('fs');
function tryCode(){const c=codeIn.value.trim().toUpperCase().replace(/\s/g,'');
 for(let n=2;n<=MAXL;n++)if(c===codeFor(n)){codeIn.blur();codeIn.value='';startAt(n);return}
 cm.textContent='Code invalide';setTimeout(()=>cm.textContent='',2000)}
document.getElementById('go').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();tryCode()});
codeIn.addEventListener('keydown',e=>{if(e.key=='Enter'){e.preventDefault();tryCode()}});
function isFS(){return document.fullscreenElement||document.webkitFullscreenElement}
fsb.addEventListener('pointerdown',async e=>{e.preventDefault();e.stopPropagation();
 const d=document.documentElement;
 try{if(isFS()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
 else{await (d.requestFullscreen||d.webkitRequestFullscreen).call(d);try{await screen.orientation.lock('landscape')}catch(_){}}}
 catch(_){alert("Plein écran bloqué ici. Ouvre le lien du jeu directement dans ton navigateur (Chrome) pour l'activer.")}});
document.addEventListener('fullscreenchange',()=>{fsb.textContent=isFS()?'✕':'⛶'});
const cv=document.getElementById('g'),ctx=cv.getContext('2d');
const W=800,H=450,SEA=380,DECK=340,CX0=100,CX1=720;let WORLD=5400,lvl=1,lvT=0,lvScore=0;const MAXL=2;
const keys={};let S='title',endT=0,t=0,cam=0,camC=0,camY=0,z=1,score=0,lives=3,msg='';
function wrapD(d){return ((d+WORLD/2)%WORLD+WORLD)%WORLD-WORLD/2}
function tryStart(){if(S!='play'&&Date.now()-endT>800){if(S=='over')retryLevel();else if(S=='win'&&lvl<MAXL)nextLevel();else newGame()}}
addEventListener('keydown',e=>{if(e.target&&e.target.tagName=='INPUT')return;keys[e.code]=1;if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault();tryStart()});
addEventListener('keyup',e=>keys[e.code]=0);
cv.addEventListener('pointerdown',tryStart);
document.querySelectorAll('button').forEach(b=>{const k=b.dataset.k;
b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1;tryStart()});
['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,e=>{keys[k]=0}))});
let isl=[];
function gY(x){x=((x%WORLD)+WORLD)%WORLD;let y=SEA;for(const i of isl){const d=(x-i.cx)/i.hw;if(Math.abs(d)<1)y=Math.min(y,SEA-i.h*Math.sqrt(1-d*d))}return y}
let p,tg,bl,bm,eb,ex,sm,ep,gsm=DECK;
const TYPES={gun:{w:24,h:16,hp:3,pts:100},tank:{w:30,h:14,hp:3,pts:150},bld:{w:34,h:34,hp:5,pts:200},sol:{w:12,h:16,hp:1,pts:50,opt:1}};
function newGame(){lvl=1;score=0;lives=3;startLevel()}
function nextLevel(){lvl++;startLevel()}
function retryLevel(){score=lvScore;lives=3;startLevel()}
function startAt(n){lvl=n-1;score=0;lives=3;nextLevel()}
function codeFor(n){return ['CHARLIE','DELTA','ECHO','FOXTROT'][n-2]+n}
function startLevel(){lvScore=score;msg='';tg=[];bl=[];bm=[];eb=[];ex=[];sm=[];ep=[];lvT=t;
const L2=lvl==2;WORLD=L2?7200:5400;
isl=(L2?[[1300,240,75],[2150,200,60],[3000,270,95],[3850,230,70],[4700,280,90],[5550,220,65],[6400,250,85]]:[[1300,230,70],[2150,260,90],[3000,220,60],[3850,280,95],[4700,240,75]]).map(([cx,hw,h])=>({cx,hw,h}));
const ty=L2?['gun','tank','bld','gun','tank']:['gun','tank','bld','gun'],off=L2?[-.6,-.3,0,.3,.6]:[-.55,-.15,.2,.55],cdb=L2?50:70;
isl.forEach(i=>{ty.forEach((k,j)=>{const x=i.cx+off[j]*i.hw;tg.push({k,x,gy:gY(x),hp:TYPES[k].hp,cd:cdb+Math.random()*80,...TYPES[k]})});
 for(let s=0;s<(L2?7:5);s++){const x=i.cx+(Math.random()*1.5-.75)*i.hw;tg.push({k:'sol',x,gy:gY(x),dir:Math.random()<.5?-1:1,isl:i,cd:60+Math.random()*100,...TYPES.sol})}});
if(L2)for(let i=0;i<7;i++){const y0=90+(i*41)%120;ep.push({x:(i+.5)*WORLD/7+600,y:y0,y0,dir:i%2?1:-1,a:0,sp:2.4,hp:2,cd:80,tc:0,pts:250,fall:0,vy:0})}
respawn();S='play'}
function respawn(){p={x:170,y:DECK-7,sp:0,a:0,dir:1,st:'deck',hp:3,bombs:6,cd:0,bcd:0,inv:0,dt:0};cam=0;camC=170;camY=0;z=1.6;gsm=DECK}
function boom(x,y,r,w){AU.boom(x,r,w);ex.push({x,y,r,l:0,w})}
function crash(){boom(p.x,p.y,45);lives--;p.st='dead';p.dt=90;if(lives<=0){S='over';endT=Date.now();AU.jingle(0);msg='GAME OVER'}}
function hit(){if(p.inv>0)return;AU.hit();p.hp--;p.inv=60;boom(p.x,p.y,20);if(p.hp<=0)crash()}
function kill(o){score+=o.pts;if(o.k=='sol')AU.scream(o.x);boom(o.x,o.gy-o.h/2,o.k=='sol'?14:28)}
function left(){return tg.filter(o=>o.hp>0&&!o.opt).length+ep.filter(e=>e.hp>0).length}
function overDeck(x){return x>CX0-60&&x<CX1+40}
function altitude(){return (overDeck(p.x)?DECK:gY(p.x))-p.y}
function upd(){
if(S!='play')return;t++;
const L=keys.ArrowLeft,R=keys.ArrowRight,U=keys.ArrowUp,D=keys.ArrowDown;
if(p.inv>0)p.inv--;if(p.ng>0)p.ng--;if(p.cd>0)p.cd--;if(p.bcd>0)p.bcd--;
if(p.st=='dead'){if(--p.dt<=0&&S=='play')respawn()}
else if(p.st=='deck'){
 if(R){p.dir=1;p.sp=Math.min(4,p.sp+.04)}else if(L){p.dir=-1;p.sp=Math.min(4,p.sp+.04)}else p.sp=Math.max(0,p.sp-.1);
 p.a=0;p.x+=p.dir*p.sp;p.y=DECK-7;
 if(p.sp>2&&U){p.st='fly';p.a=-.3;p.ng=30}
 else if((p.dir==1&&p.x>CX1)||(p.dir==-1&&p.x<CX0)){p.st='fly';p.a=.05}
 if(p.x<0)p.x+=WORLD;if(p.x>=WORLD)p.x-=WORLD;
 if(left()==0&&p.sp==0){S='win';endT=Date.now();AU.jingle(1);msg=lvl<MAXL?'NIVEAU 1 TERMINÉ !':'VICTOIRE TOTALE !'}
}else{
 if(R)p.dir=1;if(L)p.dir=-1;
 if(U)p.a-=.035;else if(D)p.a+=.035;else p.a+=(-.07-p.a)*.01;
 // aide à l'atterrissage : arrondi automatique au-dessus du pont
 if(!U&&p.x>CX0-80&&p.x<CX1+20&&p.y>DECK-70&&p.y<DECK-9)p.a+=(.06-p.a)*.07;
 p.sp=3+1.2*Math.sin(p.a);
 p.x+=p.dir*Math.cos(p.a)*p.sp;p.y+=Math.sin(p.a)*p.sp+.2;
 p.x=((p.x%WORLD)+WORLD)%WORLD;if(p.y<15)p.y=15;
 if(keys.Space&&p.cd<=0){p.cd=6;AU.gun();bl.push({x:p.x+p.dir*Math.cos(p.a)*16,y:p.y+Math.sin(p.a)*16,vx:p.dir*Math.cos(p.a)*9,vy:Math.sin(p.a)*9,l:45})}
 if(keys.KeyB&&p.bcd<=0&&p.bombs>0){p.bcd=25;p.bombs--;AU.bomb();bm.push({x:p.x,y:p.y+6,vx:p.dir*Math.cos(p.a)*p.sp*.8,vy:Math.sin(p.a)*p.sp*.5})}
 if(p.hp<=1&&t%3==0)sm.push({x:p.x-p.dir*14,y:p.y,l:0});
 const inDeck=p.x>CX0&&p.x<CX1;
 if(inDeck&&p.y>=DECK-9&&p.y<DECK+10){
  if(p.ng>0){}else if(Math.abs(Math.sin(p.a))<.8){AU.land();p.st='deck';p.sp=Math.min(p.sp,2.6);p.a=0;p.y=DECK-7;p.bombs=6;p.hp=3}
  else crash();
 }else if(inDeck&&p.y>=DECK+10)crash();
 else if(!overDeck(p.x)&&p.y>=Math.min(gY(p.x),SEA)-4)crash();
 else if(overDeck(p.x)&&!inDeck&&p.y>=SEA-4)crash();
}
for(const b of bl){b.x=(b.x+b.vx+WORLD)%WORLD;b.y+=b.vy;b.l--;
 if(b.y>=gY(b.x))b.l=0;
 for(const o of tg)if(o.hp>0&&b.l>0&&Math.abs(wrapD(b.x-o.x))<Math.max(o.w,12)/2+2&&b.y>o.gy-o.h-4&&b.y<o.gy+2){b.l=0;o.hp--;boom(b.x,b.y,6);if(o.hp<=0)kill(o)}}
for(const b of bl)for(const e of ep)if(e.hp>0&&b.l>0&&Math.hypot(wrapD(b.x-e.x),b.y-e.y)<18){b.l=0;e.hp--;boom(b.x,b.y,8);if(e.hp<=0){e.fall=1;e.vy=0;score+=e.pts;boom(e.x,e.y,26)}}
bl=bl.filter(b=>b.l>0);
for(const b of bm){b.vy+=.1;b.x=(b.x+b.vx+WORLD)%WORLD;b.y+=b.vy;
 if(b.y>=gY(b.x)){b.d=1;boom(b.x,b.y,38,gY(b.x)>=SEA-1);
  for(const o of tg)if(o.hp>0&&Math.hypot(wrapD(o.x-b.x),o.gy-o.h/2-b.y)<48){o.hp=0;kill(o)}}}
bm=bm.filter(b=>!b.d);
for(const o of tg){if(o.hp<=0)continue;
 if(o.k=='sol'){o.x+=o.dir*.35;if(Math.abs(o.x-o.isl.cx)>o.isl.hw-25)o.dir*=-1;o.gy=gY(o.x);
  if(--o.cd<=0&&p.st=='fly'&&Math.abs(wrapD(p.x-o.x))<300&&p.y<o.gy-12){
   o.cd=110+Math.random()*90;const dx=wrapD(p.x-o.x),dy=p.y-(o.gy-10),d=Math.hypot(dx,dy);
   AU.rifle(o.x);eb.push({x:o.x,y:o.gy-10,vx:dx/d*3+(Math.random()-.5)*.9,vy:dy/d*3+(Math.random()-.5)*.9,l:130,s:1})}
  continue}
 if(o.k!='gun')continue;
 if(--o.cd<=0&&p.st=='fly'&&Math.abs(wrapD(p.x-o.x))<420&&p.y<o.gy-30){
  o.cd=90+Math.random()*70;const dx=wrapD(p.x-o.x),dy=p.y-(o.gy-10),d=Math.hypot(dx,dy);
  AU.flak(o.x);eb.push({x:o.x,y:o.gy-12,vx:dx/d*3.6+(Math.random()-.5)*.8,vy:dy/d*3.6+(Math.random()-.5)*.8,l:160})}}
